# West manifest: upstream Zephyr with only the modules this board needs.
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.0.0
      import:
        name-allowlist:
          - cmsis
          - hal_nordic
          - mcuboot
          - mbedtls
          - segger
          - tinycrypt
          - zcbor
  self:
    path: app
